<!-- Static DOM skeleton. Widgets mount into these containers; the build
     inlines this file into index.html. Keep it structural — no content. -->
<div id="app">
  <header id="topbar">
    <h1>CRASH</h1>
    <div id="clock-readout"></div>
    <div id="speed-controls"></div>
    <div id="seed-readout"></div>
  </header>

  <main>
    <section id="gauges" aria-label="Headline indicators"></section>
    <section id="watched" aria-label="Credit gap and credibility"></section>
    <section id="charts"></section>
    <section id="regime" aria-label="Regime quadrant"></section>
    <section id="dials" aria-label="Policy controls"></section>
    <aside id="pipeline" aria-label="Effects not yet landed"></aside>
    <aside id="warnings" aria-label="Ending countdowns"></aside>
  </main>

  <dialog id="why-panel"></dialog>
  <footer id="keys"></footer>
</div>
